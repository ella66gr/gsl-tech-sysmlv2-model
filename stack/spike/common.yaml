# OP-134 store spike: what every configuration shares. Used together with one
# configuration's file, never alone:
#   COMPOSE_FILE=spike/common.yaml:spike/<configuration>/compose.yaml
# (spike/bin/spike.sh sets this). With several Compose files, every relative
# path is resolved from this file's folder, stack/spike/, in every file.
#
# The gate, bootstrap and worker are the S0.1 services, with the store chosen
# by STORE_KIND in each configuration's file. Temporal is S0.1's single-machine
# form, unchanged. Only one stack may be up at a time: they share host ports
# 7210 (store) and 7220 (gate).

x-gate-image: &gate-image
  image: ontara-cafe-stack/gate:spike
  pull_policy: never

volumes:
  temporal-postgres-data:

services:
  temporal-postgresql:
    image: postgres:16.10@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
    environment: { POSTGRES_USER: temporal, POSTGRES_PASSWORD: temporal }
    volumes: [ "temporal-postgres-data:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U temporal"], interval: 5s, timeout: 5s, retries: 60, start_period: 30s }

  temporal-schema:
    image: temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
    restart: on-failure:6
    depends_on: { temporal-postgresql: { condition: service_healthy } }
    environment: { DB: postgres12, DB_PORT: "5432", POSTGRES_USER: temporal, POSTGRES_PWD: temporal, POSTGRES_SEEDS: temporal-postgresql, SQL_PASSWORD: temporal }
    volumes: [ "../temporal/scripts:/scripts:ro" ]
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

  temporal:
    image: temporalio/server:1.32.0@sha256:c3e752127759616bb1615e0f9ba0e21635aeb5fdeb922de4f371c350955f46ae
    depends_on: { temporal-schema: { condition: service_completed_successfully } }
    environment: { DB: postgres12, DB_PORT: "5432", POSTGRES_USER: temporal, POSTGRES_PWD: temporal, POSTGRES_SEEDS: temporal-postgresql, BIND_ON_IP: 0.0.0.0, DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml }
    volumes: [ "../temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro" ]
    healthcheck: { test: ["CMD", "nc", "-z", "localhost", "7233"], interval: 5s, timeout: 3s, start_period: 30s, retries: 60 }

  temporal-namespace:
    image: temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
    restart: on-failure:5
    depends_on: { temporal: { condition: service_healthy } }
    environment: { TEMPORAL_ADDRESS: "temporal:7233", DEFAULT_NAMESPACE: default }
    volumes: [ "../temporal/scripts:/scripts:ro" ]
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  bootstrap:
    <<: *gate-image
    build: { context: ../gate }
    command: ["node", "dist/cli/bootstrap.js"]
    environment: &gate-env
      GRAPHDB_REPOSITORY: cafe-runtime
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      GATE_URL: http://gate:7220
      STACK_DIR: /stack
    volumes: &gate-volumes
      - ../fixtures:/stack/fixtures:ro
      - ../results:/stack/results
      - ../../ontology:/stack/kg-source/ontology:ro
      - ../../generated/ontology:/stack/kg-source/generated-ontology:ro
    restart: "no"

  gate:
    <<: *gate-image
    command: ["node", "dist/server.js"]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      temporal-namespace: { condition: service_completed_successfully }
    environment: *gate-env
    volumes: *gate-volumes
    ports: [ "127.0.0.1:7220:7220" ]
    healthcheck: { test: ["CMD", "node", "dist/cli/live.js"], interval: 5s, timeout: 5s, retries: 30, start_period: 5s }

  worker:
    <<: *gate-image
    command: ["node", "dist/worker.js"]
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }
      bootstrap: { condition: service_completed_successfully }
    environment: *gate-env
    restart: unless-stopped
