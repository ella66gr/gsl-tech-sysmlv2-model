# Ontara Cafe runtime stack (Plan B Stage 0, step S0.1).
#
# GraphDB 11.3.1 (SHACL in the write transaction), a thin TypeScript
# constraint gate, and Temporal in its documented single-machine form
# (temporalio/samples-server, compose/docker-compose-postgres.yml).
#
# The stack depends on nothing on the host except Docker, Compose, git and the
# GraphDB licence file named by GRAPHDB_LICENSE_FILE (see README, step 2).
# All published ports bind to 127.0.0.1 only.
#
# Images are pinned by tag and multi-arch index digest, so the same line
# resolves to arm64 on the Mac and amd64 on the Linux laptop. The only image
# the stack builds (the gate) is built on the machine that runs it (S0.1
# image rule, specification section 2.5 item 10).

name: ontara-cafe-stack

x-gate-image: &gate-image
  image: ontara-cafe-stack/gate:local
  pull_policy: never

secrets:
  graphdb_license:
    file: ${GRAPHDB_LICENSE_FILE:?GRAPHDB_LICENSE_FILE is not set. Follow README step 2.}

volumes:
  graphdb-data:
  temporal-postgres-data:

networks:
  stack:
    name: ontara-cafe-stack

services:

  # ---------------------------------------------------------------- GraphDB
  graphdb:
    image: ontotext/graphdb:11.3.1@sha256:bb94992347eeea71ea254326709b6cd5964dc9e6803962501d512d1cc045869a
    secrets:
      - graphdb_license
    environment:
      GDB_HEAP_SIZE: ${GRAPHDB_HEAP:-2g}
      # The licence is read in place from the read-only secret mount; it is
      # never copied into the data volume or the repository.
      GDB_JAVA_OPTS: >-
        -Dgraphdb.license.file=/run/secrets/graphdb_license
    volumes:
      - graphdb-data:/opt/graphdb/home
      - ./graphdb/tools:/opt/stack-tools:ro
    ports:
      - "127.0.0.1:${GRAPHDB_PORT:-7210}:7200"
    networks: [stack]
    healthcheck:
      # Without a licence every REST call returns 500, so a 200 here also
      # shows the licence loaded.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7200/rest/repositories"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # ------------------------------------------------------- Temporal (store)
  temporal-postgresql:
    image: postgres:16.10@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks: [stack]
    # Not published: the host's own Postgres keeps 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-schema:
    image: temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
    restart: on-failure:6
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      SQL_PASSWORD: temporal
    volumes:
      - ./temporal/scripts:/scripts:ro
    networks: [stack]
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

  temporal:
    image: temporalio/server:1.32.0@sha256:c3e752127759616bb1615e0f9ba0e21635aeb5fdeb922de4f371c350955f46ae
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks: [stack]
    # Not published: only the gate and the worker talk to Temporal.
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    volumes:
      - ./temporal/scripts:/scripts:ro
    networks: [stack]
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  # ------------------------------------------------- Bootstrap (one-shot)
  # Creates the runtime repository from GraphDB's own JSON default config,
  # reads the configuration back and exits non-zero unless isShacl is true,
  # then loads the stand-in shapes and the knowledge-graph content.
  bootstrap:
    <<: *gate-image
    build:
      context: ./gate
    command: ["node", "dist/cli/bootstrap.js"]
    depends_on:
      graphdb:
        condition: service_healthy
    environment: &gate-env
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-cafe-runtime}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      GATE_URL: http://gate:7220
      STACK_DIR: /stack
    volumes: &gate-volumes
      - ./fixtures:/stack/fixtures:ro
      - ./results:/stack/results
      - ../ontology:/stack/kg-source/ontology:ro
      - ../generated/ontology:/stack/kg-source/generated-ontology:ro
    networks: [stack]
    restart: "no"

  # ---------------------------------------------------- Constraint gate
  gate:
    <<: *gate-image
    command: ["node", "dist/server.js"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    environment: *gate-env
    volumes: *gate-volumes
    ports:
      - "127.0.0.1:${GATE_PORT:-7220}:7220"
    networks: [stack]
    healthcheck:
      test: ["CMD", "node", "dist/cli/live.js"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ----------------------------------------- Temporal worker (no-op only)
  # Serves the health check's no-op workflow. Nothing else is deployed to
  # Temporal at S0.1; S0.6 adds the fulfilment workflow.
  worker:
    <<: *gate-image
    command: ["node", "dist/worker.js"]
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    environment: *gate-env
    networks: [stack]
    restart: unless-stopped
