# Ontara Cafe runtime stack (Plan B Stage 0, step S0.1; pass 3, S521).
#
# Apache Jena Fuseki on Jena 6.2.0 with Ontara's validated-update module
# (SHACL in the write transaction, targeted mode; ADR-014), a thin TypeScript
# constraint gate, and Temporal in its documented single-machine form
# (temporalio/samples-server, compose/docker-compose-postgres.yml).
#
# The stack depends on nothing on the host except Docker, Compose and git
# (README step 2). It needs no licence. All published ports bind to
# 127.0.0.1 only.
#
# Pulled images are pinned by tag and multi-arch index digest, so the same
# line resolves to arm64 on the Mac and amd64 on an x86_64 machine. The two
# images the stack builds (the store and the gate) are built on the machine
# that runs them (S0.1 image rule, specification section 2.5 item 10).

name: ontara-cafe-stack

# The Jena version: the store image's build argument and what the bootstrap
# and the health check require the running module to report. Pinned; never
# below 6.1.0 (ADR-014). The store's Dockerfile refuses to build below 6.1.0.
x-jena-version: &jena-version "6.2.0"
# The validation mode the module runs in and the bootstrap requires.
x-validation-mode: &validation-mode targeted

x-gate-image: &gate-image
  image: ontara-cafe-stack/gate:local
  pull_policy: never

volumes:
  store-data:
  temporal-postgres-data:

networks:
  stack:
    name: ontara-cafe-stack

services:

  # ------------------------------------------------------------ The store
  # Two TDB2 datasets, declared in the module's own configuration
  # (stack/store/module, dev.ontara.store.OntaraFuseki): /cafe-runtime
  # (knowledge graph and runtime state; README section 4) and
  # /cafe-capability-scratch. Each has its union graph as the default graph,
  # and the module's validated-update endpoint. The module has two listeners
  # (README section 8): 3030, on the stack network only, where Fuseki's
  # standard endpoints accept writes (they do NOT validate: the bootstrap's
  # knowledge-graph and shapes load, and the capability checks' scratch
  # clearing); and 3031, the only one published, where the standard
  # endpoints are read-only. Only the gate's write path uses validated-update.
  store:
    image: ontara-cafe-stack/store:local
    pull_policy: never
    build:
      context: ./store
      args:
        JENA_VERSION: *jena-version
    environment:
      ONTARA_VALIDATION: *validation-mode
      JAVA_OPTS: -Xmx${STORE_HEAP:-2g} -Xms${STORE_HEAP:-2g}
    volumes:
      - store-data:/fuseki/databases
    ports:
      # The published listener only (read-only standard endpoints). Never
      # publish 3030: its standard endpoints accept unvalidated writes.
      - "127.0.0.1:${STORE_PORT:-7210}:3031"
    networks: [stack]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:3030/cafe-runtime/validated-update && curl -fsS -o /dev/null http://localhost:3031/cafe-runtime/validated-update"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  # ------------------------------------------------------- Temporal (store)
  temporal-postgresql:
    image: postgres:16.10@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks: [stack]
    # Not published: the host's own Postgres keeps 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-schema:
    image: temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
    restart: on-failure:6
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      SQL_PASSWORD: temporal
    volumes:
      - ./temporal/scripts:/scripts:ro
    networks: [stack]
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

  temporal:
    image: temporalio/server:1.32.0@sha256:c3e752127759616bb1615e0f9ba0e21635aeb5fdeb922de4f371c350955f46ae
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks: [stack]
    # Not published: only the gate and the worker talk to Temporal.
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    volumes:
      - ./temporal/scripts:/scripts:ro
    networks: [stack]
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  # ------------------------------------------------- Bootstrap (one-shot)
  # Reads the module's status on both datasets and exits non-zero, loudly,
  # unless it reports validating on, targeted mode, Jena 6.2.0 and (after
  # loading) the shapes; loads the runtime shapes and the knowledge graph.
  bootstrap:
    <<: *gate-image
    build:
      context: ./gate
    command: ["node", "dist/cli/bootstrap.js"]
    depends_on:
      store:
        condition: service_healthy
    environment: &gate-env
      STORE_URL: http://store:3030
      STORE_DATASET: cafe-runtime
      EXPECTED_JENA_VERSION: *jena-version
      EXPECTED_VALIDATION_MODE: *validation-mode
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      GATE_URL: http://gate:7220
      STACK_DIR: /stack
    volumes: &gate-volumes
      - ./fixtures:/stack/fixtures:ro
      - ./results:/stack/results
      - ../ontology:/stack/kg-source/ontology:ro
      - ../generated/ontology:/stack/kg-source/generated-ontology:ro
    networks: [stack]
    restart: "no"

  # ---------------------------------------------------- Constraint gate
  gate:
    <<: *gate-image
    command: ["node", "dist/server.js"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    environment: *gate-env
    volumes: *gate-volumes
    ports:
      - "127.0.0.1:${GATE_PORT:-7220}:7220"
    networks: [stack]
    healthcheck:
      test: ["CMD", "node", "dist/cli/live.js"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ----------------------------------------- Temporal worker (no-op only)
  # Serves the health check's no-op workflow. Nothing else is deployed to
  # Temporal at S0.1; S0.6 adds the fulfilment workflow.
  worker:
    <<: *gate-image
    command: ["node", "dist/worker.js"]
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    environment: *gate-env
    networks: [stack]
    restart: unless-stopped
