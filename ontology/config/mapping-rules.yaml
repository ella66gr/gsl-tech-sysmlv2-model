# Ontara Knowledge Graph — Mapping Classification Rules
# ======================================================
#
# Declarative specification for how SysML v2 constructs map to
# OWL/RDF entities in the knowledge graph. Used by gen_owl_pipeline.py
# (pipeline Stage 2) to classify each parsed element.
#
# Decision S100-D5: these rules are declarative and version-controlled,
# not embedded in procedural code.
#
# Source: Stage 5 Phase 1 — Step 4 (Session 100 plan §3, Step 4)
# Status: Skeleton — to be populated at Step 4 implementation.

version: "2.0.0"
session: 116

# IRI namespaces
namespaces:
  ontara-bmm: "https://ontara.dev/ontology/bmm/"
  ontara-data: "https://ontara.dev/data/"
  ontara-meta: "https://ontara.dev/ontology/meta/"
  bfo: "http://purl.obolibrary.org/obo/"
  cco: "https://www.commoncoreontologies.org/"
  iao: "http://purl.obolibrary.org/obo/IAO_"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  owl: "http://www.w3.org/2002/07/owl#"
  skos: "http://www.w3.org/2004/02/skos/core#"

# Named graphs (three-stratum architecture, B28)
named_graphs:
  metamodel: "https://ontara.dev/graph/metamodel"
  domain: "https://ontara.dev/graph/domain"
  correspondence: "https://ontara.dev/graph/correspondence"

# Classification rules
# Each rule matches a SysML construct pattern and assigns a mapping category.
# Rules are evaluated in order; first match wins.
rules:

  # --- Phase 1: DomainClass (part_def) ---
  - match:
      construct: "part_def"
      package_set:
        - "ServiceConcept"
        - "ActivityModel"
        - "ResourcePlanning"
        - "FinancialPlanning"
        - "GovernanceMapping"
        - "StakeholderModel"
      has_annotation: "@BfoType"
    classification: "DomainClass"
    target_graph: "domain"
    iri_template: "{ontara-bmm}{ElementName}"
    notes: "BMM part defs with BFO mapping → OWL classes in domain graph"

  # --- Phase 1: DomainClass (requirement_def) ---
  - match:
      construct: "requirement_def"
      package_set:
        - "ServiceConcept"
        - "ActivityModel"
        - "ResourcePlanning"
        - "FinancialPlanning"
        - "GovernanceMapping"
        - "StakeholderModel"
      has_annotation: "@BfoType"
    classification: "DomainClass"
    target_graph: "domain"
    iri_template: "{ontara-bmm}{ElementName}"
    notes: "BMM requirement defs with BFO mapping → OWL classes in domain graph"

  # --- Phase 2: ObjectProperty (typed refs in DomainClass elements) ---
  # Typed ref attributes in BMM part defs become OWL object properties.
  # The ref is extracted by the parser; this rule is evaluated against
  # the ref attribute data attached to DomainClass elements, not against
  # standalone elements. See gen_owl_pipeline.py Stage 3c.
  # Classification applied programmatically in Stage 3c — no match rule
  # needed here. This entry documents the category for the mapping IR.

  # --- Phase 1: StructuralOnly (BMM without BFO) ---
  - match:
      construct: "part_def"
      package_set:
        - "ServiceConcept"
        - "ActivityModel"
        - "ResourcePlanning"
        - "FinancialPlanning"
        - "GovernanceMapping"
        - "StakeholderModel"
      has_annotation: null
    classification: "StructuralOnly"
    target_graph: null
    notes: "BMM part defs without BFO mapping — flag for review"

  # --- Phase 1: StructuralOnly (everything else) ---
  - match:
      construct: "*"
    classification: "StructuralOnly"
    target_graph: null
    notes: "All non-BMM constructs excluded from Phase 1 domain graph"

# Annotation extraction for domain graph entities
annotation_mapping:
  rdfs_label:
    source: "@UserFacing.friendlyName"
    notes: "Authority zone: shared-constrained"
  rdfs_comment:
    source: "@UserFacing.shortDescription"
    notes: "Authority zone: shared-constrained"
  skos_definition:
    source: "@PurposiveDescription.description"
    notes: "Authority zone: shared-constrained"
  bfo_parent:
    source: "@BfoType.bfoClass"
    notes: "Authority zone: OWL-authoritative (inferred from SysML annotation)"
  mid_level_parent:
    source: "@BfoType.midLevelClass"
    notes: "Authority zone: OWL-authoritative"

# Object property mapping (Phase 2 — typed ref extraction)
# Typed ref attributes in DomainClass part defs are mapped to OWL object
# properties. The mapping is programmatic (Stage 3c of the pipeline):
#   - ref name → property local name (camelCase → has + PascalCase)
#   - owning part def → rdfs:domain
#   - target type → rdfs:range
#   - multiplicity [1] or [0..1] → owl:FunctionalProperty
#   - multiplicity [0..*] or [1..*] → non-functional
#   - no multiplicity (bare ref) → owl:FunctionalProperty (implicit [1])
object_property_mapping:
  iri_namespace: "https://ontara.dev/ontology/bmm/axioms#"
  naming_convention: "camelCase with 'has' prefix"
  authority_zone: "shared-constrained"
  notes: "Pipeline-generated properties must validate against hand-authored axioms in ontara-bmm-axioms.ttl"

# Authority zones (B29 / E020)
authority_zones:
  sysml_authoritative:
    - "package structure"
    - "part def / part relationships"
    - "attribute types and multiplicities"
    - "weighted relationships"
    - "comprehension metadata"
  owl_authoritative:
    - "BFO classification (inferred hierarchy)"
    - "ontological semantics"
    - "reasoner-derived inferences"
  shared_constrained:
    - "rdfs:label (from @UserFacing.friendlyName)"
    - "rdfs:comment (from @UserFacing.shortDescription)"
    - "skos:definition (from @PurposiveDescription.description)"
