# =========================================================================
# CONCEPT GRAPH — Semantic Relationships
#
# Typed relationships between patterns, principles, and concepts.
# SysML is the source of truth for what exists; this file declares
# how things relate semantically.
#
# Relationship vocabulary:
#   dependsOn     — X requires Y to function or make sense
#   enables       — X makes Y possible or practical
#   motivatedBy   — X was designed to fulfil principle Y
#   generalises   — X is a more abstract version of Y
#   specialises   — X is a more specific version of Y
#   constrains    — X limits or governs Y
#   analogueTo    — X in domain A is structurally equivalent to Y in domain B
#   extends       — X adds capability on top of Y
#   validates     — X provides evidence that Y works
#   composedWith  — X and Y are used together as a combined approach
#
# Convention:
#   - subject/object use PatternCatalogue part names (camelCase)
#   - Principles use Principles:: prefix (not yet in SysML — candidates
#     for future ArchitecturalPrinciple part defs)
#   - Meta model packages use their SysML qualified names
#
# Source: Session 31, Concept Graph Enhancement workstream.
# =========================================================================

# -------------------------------------------------------------------
# Relationship vocabulary definition
# -------------------------------------------------------------------
vocabulary:
  - id: dependsOn
    label: "depends on"
    description: "X requires Y to function or make sense"
    inverse: enables

  - id: enables
    label: "enables"
    description: "X makes Y possible or practical"
    inverse: dependsOn

  - id: motivatedBy
    label: "motivated by"
    description: "X was designed to fulfil principle Y"
    inverse: motivates

  - id: generalises
    label: "generalises"
    description: "X is a more abstract version of Y"
    inverse: specialises

  - id: specialises
    label: "specialises"
    description: "X is a more specific version of Y"
    inverse: generalises

  - id: constrains
    label: "constrains"
    description: "X limits or governs Y"
    inverse: constrainedBy

  - id: analogueTo
    label: "analogue to"
    description: "X in one domain is structurally equivalent to Y in another"
    inverse: analogueTo

  - id: extends
    label: "extends"
    description: "X adds capability on top of Y"
    inverse: extendedBy

  - id: validates
    label: "validates"
    description: "X provides evidence that Y works"
    inverse: validatedBy

  - id: composedWith
    label: "composed with"
    description: "X and Y are used together as a combined approach"
    inverse: composedWith

