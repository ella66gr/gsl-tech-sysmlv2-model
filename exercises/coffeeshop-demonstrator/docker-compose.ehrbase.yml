# =============================================================================
# Coffee Shop Demonstrator — Local Development Stack
#
# Three persistence layers:
#   1. CDR — EHRbase 2.11.0 with PostgreSQL (port 5433)
#   2. Business Database — PostgreSQL 16 (port 5434)
#   3. Process Engine — Temporal (external, not in this compose file)
#
# Usage:
#   docker compose -f docker-compose.ehrbase.yml up -d
#   docker compose -f docker-compose.ehrbase.yml down
#   docker compose -f docker-compose.ehrbase.yml down -v   # also removes data volumes
#
# EHRbase:
#   Swagger UI:  http://localhost:8080/ehrbase/swagger-ui.html
#   Health check: curl http://localhost:8080/ehrbase/status
#   Auth (basic): ehrbase-user / SuperSecretPassword
#
# Business Database:
#   Connection:  localhost:5434 / coffeeshop_business
#   Auth:        coffeeshop / coffeeshop_dev
# =============================================================================

services:
  # ── Clinical Data Repository ─────────────────────────────────
  ehrdb:
    image: ehrbase/ehrbase-v2-postgres:16.2
    environment:
      POSTGRES_PASSWORD: postgres
      EHRBASE_USER_ADMIN: ehrbase
      EHRBASE_PASSWORD_ADMIN: ehrbase
      EHRBASE_USER: ehrbase_restricted
      EHRBASE_PASSWORD: ehrbase_restricted
    ports:
      - "5433:5432"
    volumes:
      - ehrbase-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ehrbase:
    image: ehrbase/ehrbase:2.11.0
    depends_on:
      ehrdb:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://ehrdb:5432/ehrbase
      DB_USER_ADMIN: ehrbase
      DB_PASS_ADMIN: ehrbase
      DB_USER: ehrbase_restricted
      DB_PASS: ehrbase_restricted
      SECURITY_AUTHTYPE: BASIC
      SECURITY_AUTHUSER: ehrbase-user
      SECURITY_AUTHPASSWORD: SuperSecretPassword
      SERVER_NODENAME: coffeeshop.local
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ehrbase/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Business Database ────────────────────────────────────────
  # Separate PostgreSQL instance for business data (catalogue,
  # inventory, pricing). Architecturally distinct from the CDR.
  # Port 5434 to avoid conflict with EHRbase's PostgreSQL (5433)
  # and any local PostgreSQL (5432).
  coffeeshop-db:
    image: postgres:16
    environment:
      POSTGRES_DB: coffeeshop_business
      POSTGRES_USER: coffeeshop
      POSTGRES_PASSWORD: coffeeshop_dev
    ports:
      - "5434:5432"
    volumes:
      - coffeeshop-pg-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeeshop -d coffeeshop_business"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ehrbase-pg-data:
  coffeeshop-pg-data:
