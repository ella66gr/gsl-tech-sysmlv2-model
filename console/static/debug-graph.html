<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ontara Relationships Graph — Debug View</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  h1 { padding: 16px 24px; font-size: 18px; color: #334155; }
  #graph-container { width: 100vw; height: calc(100vh - 56px); }
  svg { width: 100%; height: 100%; background: #fff; border-top: 1px solid #e2e8f0; }
  .node-label { font-size: 10px; fill: #475569; text-anchor: middle; pointer-events: none; }
  .tooltip { position: fixed; background: #1e293b; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 100; max-width: 360px; }
</style>
</head>
<body>
<h1>Ontara — Weighted Relationships Debug View</h1>
<div id="graph-container">
  <svg id="graph"></svg>
</div>
<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
const CONCERN_COLOURS = {
  ServiceConcept: '#3b82f6',
  ActivityModel: '#10b981',
  ResourceCapability: '#f59e0b',
  FinancialModel: '#a855f7',
  Governance: '#f43f5e',
};

const TAPER_HALF = { strong: 9, moderate: 5, weak: 2, contextual: 1.5 };
const STRENGTH_OPACITY = { strong: 0.85, moderate: 0.55, weak: 0.3, contextual: 0.2 };

function colour(concern) { return CONCERN_COLOURS[concern] || '#6b7280'; }

fetch('data/model-introspection.json')
  .then(r => r.json())
  .then(data => {
    const g = data.weightedRelationshipGraph;
    if (!g) { document.body.innerHTML += '<p style="padding:24px;color:red;">No weightedRelationshipGraph in JSON.</p>'; return; }

    const nodes = g.nodes.map(n => ({ ...n, degree: 0 }));
    const nodeMap = new Map(nodes.map(n => [n.id, n]));
    const edges = g.edges.filter(e => nodeMap.has(e.source) && nodeMap.has(e.target))
      .map(e => ({ ...e, sourceNode: null, targetNode: null, isBi: false, curveDir: 0 }));

    // Degrees
    edges.forEach(e => {
      nodeMap.get(e.source).degree++;
      nodeMap.get(e.target).degree++;
    });

    // Bidirectional
    const edgeSet = new Set(edges.map(e => e.source + '->' + e.target));
    edges.forEach(e => {
      if (edgeSet.has(e.target + '->' + e.source)) {
        e.isBi = true;
        e.curveDir = e.source < e.target ? 1 : -1;
      }
    });

    const svg = d3.select('#graph');
    const container = document.getElementById('graph-container');
    const W = container.clientWidth;
    const H = container.clientHeight;

    const radiusScale = d3.scaleSqrt()
      .domain([0, d3.max(nodes, n => n.degree)])
      .range([8, 28]);

    // Simulation
    const sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(edges).id(d => d.id).distance(140))
      .force('charge', d3.forceManyBody().strength(-500))
      .force('center', d3.forceCenter(W / 2, H / 2))
      .force('collide', d3.forceCollide(d => radiusScale(d.degree) + 15))
      .stop();

    for (let i = 0; i < 400; i++) sim.tick();

    // Compute bounding box and set viewBox
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(n => {
      const r = radiusScale(n.degree) + 20; // extra for labels
      minX = Math.min(minX, n.x - r);
      minY = Math.min(minY, n.y - r);
      maxX = Math.max(maxX, n.x + r);
      maxY = Math.max(maxY, n.y + r);
    });
    const pad = 60;
    const vbX = minX - pad;
    const vbY = minY - pad;
    const vbW = (maxX - minX) + pad * 2;
    const vbH = (maxY - minY) + pad * 2;
    svg.attr('viewBox', `${vbX} ${vbY} ${vbW} ${vbH}`);

    const mainGroup = svg.append('g');

    // Zoom
    svg.call(d3.zoom().scaleExtent([0.3, 5]).on('zoom', (event) => {
      mainGroup.attr('transform', event.transform);
    }));

    // --- Edge rendering: tapered polygons ---
    function quadBez(p0x, p0y, cpx, cpy, p1x, p1y, t) {
      const mt = 1 - t;
      return [mt*mt*p0x + 2*mt*t*cpx + t*t*p1x, mt*mt*p0y + 2*mt*t*cpy + t*t*p1y];
    }
    function quadTan(p0x, p0y, cpx, cpy, p1x, p1y, t) {
      const dx = 2*(1-t)*(cpx-p0x) + 2*t*(p1x-cpx);
      const dy = 2*(1-t)*(cpy-p0y) + 2*t*(p1y-cpy);
      const len = Math.sqrt(dx*dx+dy*dy) || 1;
      return [dx/len, dy/len];
    }

    function buildTaper(e) {
      const src = e.source;
      const tgt = e.target;
      const srcR = radiusScale(src.degree);
      const tgtR = radiusScale(tgt.degree);
      const hw = TAPER_HALF[e.strength] || 5;

      const dx = tgt.x - src.x;
      const dy = tgt.y - src.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const ux = dx/dist, uy = dy/dist;
      const px = -uy, py = ux;

      if (!e.isBi) {
        // Straight taper
        const s1x = src.x + ux*srcR + px*hw;
        const s1y = src.y + uy*srcR + py*hw;
        const s2x = src.x + ux*srcR - px*hw;
        const s2y = src.y + uy*srcR - py*hw;
        const ex = tgt.x - ux*tgtR;
        const ey = tgt.y - uy*tgtR;
        return `M${s1x},${s1y} L${ex},${ey} L${s2x},${s2y} Z`;
      }

      // Curved taper for bidirectional
      const offset = Math.max(25, dist * 0.2) * e.curveDir;
      const cpx = (src.x + tgt.x)/2 + px * offset;
      const cpy = (src.y + tgt.y)/2 + py * offset;

      // Sample bezier, build outline
      const N = 20;
      // Find start/end t by radius fraction
      let bezLen = 0;
      let prevBx = src.x, prevBy = src.y;
      for (let i = 1; i <= 40; i++) {
        const [bx, by] = quadBez(src.x, src.y, cpx, cpy, tgt.x, tgt.y, i/40);
        bezLen += Math.sqrt((bx-prevBx)**2 + (by-prevBy)**2);
        prevBx = bx; prevBy = by;
      }
      const tStart = Math.min(0.12, srcR / bezLen);
      const tEnd = Math.max(0.88, 1 - tgtR / bezLen);

      const left = [], right = [];
      for (let i = 0; i <= N; i++) {
        const t = tStart + (tEnd - tStart) * (i / N);
        const [bx, by] = quadBez(src.x, src.y, cpx, cpy, tgt.x, tgt.y, t);
        const [tx, ty] = quadTan(src.x, src.y, cpx, cpy, tgt.x, tgt.y, t);
        const npx = -ty, npy = tx;
        const w = hw * (1 - i/N) + 0.5 * (i/N);
        left.push([bx + npx*w, by + npy*w]);
        right.push([bx - npx*w, by - npy*w]);
      }
      right.reverse();
      const all = [...left, ...right];
      return 'M' + all.map(p => p[0]+','+p[1]).join(' L') + ' Z';
    }

    // Draw edges
    const edgeGroup = mainGroup.append('g');
    edgeGroup.selectAll('path')
      .data(edges)
      .join('path')
      .attr('d', buildTaper)
      .attr('fill', e => colour(e.source.bmmConcern))
      .attr('opacity', e => STRENGTH_OPACITY[e.strength] || 0.5)
      .attr('stroke', 'none')
      .on('mouseenter', (event, e) => {
        const tip = document.getElementById('tooltip');
        tip.style.display = 'block';
        tip.style.left = (event.clientX + 12) + 'px';
        tip.style.top = (event.clientY + 12) + 'px';
        tip.innerHTML = `<strong>${e.source.friendlyName} → ${e.target.friendlyName}</strong><br>${e.strength}<br><em>${e.rationale || ''}</em>`;
      })
      .on('mouseleave', () => {
        document.getElementById('tooltip').style.display = 'none';
      });

    // Draw nodes
    const nodeGroup = mainGroup.append('g');
    const nodeGs = nodeGroup.selectAll('g')
      .data(nodes)
      .join('g')
      .attr('transform', d => `translate(${d.x},${d.y})`)
      .style('cursor', 'pointer');

    nodeGs.append('circle')
      .attr('r', d => radiusScale(d.degree))
      .attr('fill', d => colour(d.bmmConcern))
      .attr('stroke', '#fff')
      .attr('stroke-width', 1.5);

    nodeGs.append('text')
      .attr('class', 'node-label')
      .attr('y', d => radiusScale(d.degree) + 14)
      .text(d => d.friendlyName);

    nodeGs.on('mouseenter', (event, d) => {
      const tip = document.getElementById('tooltip');
      tip.style.display = 'block';
      tip.style.left = (event.clientX + 12) + 'px';
      tip.style.top = (event.clientY + 12) + 'px';
      tip.innerHTML = `<strong>${d.friendlyName}</strong><br>${d.bmmConcern} · ${d.degree} connections`;
    }).on('mouseleave', () => {
      document.getElementById('tooltip').style.display = 'none';
    });

    // Stats
    const biCount = edges.filter(e => e.isBi).length / 2;
    console.log(`Graph: ${nodes.length} nodes, ${edges.length} edges, ${biCount} bidirectional pairs`);
    console.log(`ViewBox: ${vbX} ${vbY} ${vbW} ${vbH}`);
  });
</script>
</body>
</html>
